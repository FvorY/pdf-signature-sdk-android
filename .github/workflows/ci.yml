name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew ktlintCheck
      - name: Unit tests
        run: ./gradlew :psdk-core:testDebugUnitTest
      - name: Build libraries and sample
        run: ./gradlew :psdk-core:assembleRelease :psdk-pdfium:assembleRelease :sample:assembleDebug
      - name: Publish to Maven Local (same step JitPack runs)
        run: ./gradlew :psdk-core:publishToMavenLocal :psdk-pdfium:publishToMavenLocal
      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'

  # Builds a small app against the published SDK with older tools than the SDK uses, so a
  # dependency or Kotlin bump that would break existing apps fails here (see compat/README.md).
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core, AGP 8.9.1, Kotlin 2.1, JVM 1.8
            args: -Pagp=8.9.1 -Pkotlin=2.1.0 -PcompileSdk=36 -PjvmTarget=1.8
          - name: core, AGP 8.7.3, compileSdk 35
            args: -Pagp=8.7.3 -Pkotlin=2.1.0 -PcompileSdk=35 -PdisableLifecycleLint=true
          - name: core + pdfium, Kotlin 2.2, JVM 11
            args: -Pagp=8.9.1 -Pkotlin=2.2.21 -PcompileSdk=36 -PjvmTarget=11 -Ppdfium=true
    name: compat (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Publish SDK to Maven Local
        run: ./gradlew :psdk-core:publishToMavenLocal :psdk-pdfium:publishToMavenLocal
      - name: Build the app
        run: gradle -p compat :app:assembleDebug :app:assembleRelease ${{ matrix.args }}

