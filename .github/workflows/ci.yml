name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew ktlintCheck
      - name: Unit tests
        run: ./gradlew :psdk-core:testDebugUnitTest
      - name: Build libraries and sample
        run: ./gradlew :psdk-core:assembleRelease :psdk-pdfium:assembleRelease :sample:assembleDebug
      - name: Publish to Maven Local (same step JitPack runs)
        run: ./gradlew :psdk-core:publishToMavenLocal :psdk-pdfium:publishToMavenLocal
      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'
