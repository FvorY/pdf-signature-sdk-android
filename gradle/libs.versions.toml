[versions]
# A library forces its dependencies' minimum compileSdk and AGP version onto every app that uses it.
# core-ktx 1.16 and activity 1.10 keep apps on AGP 8.6+ / compileSdk 35+ working; newer releases
# need AGP 8.9.1 and compileSdk 36. Check the AAR metadata before raising them.
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.06.01"
coroutines = "1.11.0"
core-ktx = "1.16.0"
activity-compose = "1.10.1"
lifecycle = "2.10.0"
junit = "4.13.2"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
org-json = "20250517"
ktlint-gradle = "14.2.0"
# 2.0.x needs kotlin-stdlib 2.3, so apps using psdk-pdfium need Kotlin 2.2 or newer.
pdfium = "2.0.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
pdfium-android = { module = "io.legere:pdfiumandroid", version.ref = "pdfium" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
# Real org.json for JVM unit tests (android.jar only has stubs)
org-json = { module = "org.json:json", version.ref = "org-json" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself ("built-in Kotlin"). This entry is only used to put
# the chosen Kotlin Gradle plugin version on the build classpath; it is never applied.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
